# c-a prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set-option -g default-shell /usr/bin/zsh

bind C-c source-file ~/.config/tmux/tmux.conf \; display "Reloaded Config!"

# why not
set-option -g history-limit 1000000

# blank out rename prompt
bind , command-prompt "rename-window '%%'"
bind $ command-prompt "rename-session '%%'"

# more sensible splits that open in current directory
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %
# windows also
bind c new-window -c "#{pane_current_path}"

# fix colors
set-option -sa terminal-overrides ",xterm*:Tc"

# set terminal title sync with tmux session title
set-option -g set-titles on
set-option -g set-titles-string "#W"

# faster status interval
set -g status-interval 10

# maus
set -g mouse on

# don't exit when scrolling to the bottom or else mashing ctrl+d to scroll causes issues
set -g exit-empty off

# start windows and panes at 1 because it's on the left of the keyboard
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# changed copy mode keybindings
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# make swapping windows easier
bind S-left run "tmux swap-window -d -t #{e|-|:#I,1}"
bind S-right run "tmux swap-window -d -t #{e|+|:#I,1}"

# I'm lazy, this is faster
bind C-q kill-session

# tmux-sensible from https://github.com/tmux-plugins/tmux-sensible
# commit 25cb91f42d020f675bb0a2ce3fbd3a5d96119efa
# remember to `chmod +x` when updating
run-shell ~/.config/tmux/sensible.tmux