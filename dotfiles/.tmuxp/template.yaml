session_name: template
start_directory: $HOME
suppress_history: false
windows:
- panes:
  - focus: "true"
    shell_command: nvrws
  window_name: nvim

- panes:
  - focus: "true"
    shell_command:
    - cmd: echo foo
      enter: false
  window_name: run

- panes:
  - focus: "true"
    shell_command: lazygit
  window_name: lazygit

- panes:
  - focus: "true"
  focus: "true"
