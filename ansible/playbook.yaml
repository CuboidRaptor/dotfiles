- name: Default playbook
  hosts: all
  become: true
  # NOTE: this playbook probably only works with latest Fedora version + btrfs
  tasks:
    - name: Set Fedora Release Version Number Variable
      ansible.builtin.command:
        cmd: rpm -E %fedora
      register: fedora_release_number
      changed_when: false
    - name: Set Fedora Release Version Number Fact
      ansible.builtin.set_fact:
        fedora_release_number: "{{ fedora_release_number.stdout }}"

    - name: Set Username Variable
      ansible.builtin.command:
        cmd: logname
      register: usern
      changed_when: false
    - name: Set Username Fact
      ansible.builtin.set_fact:
        usern: "{{ usern.stdout }}"

    - name: Copying dnf5 config
      ansible.builtin.copy:
        src: 9999-automated-dnf5.conf
        dest: /etc/dnf/libdnf5.conf.d/9999-automated-dnf5.conf

    - name: Download RPM Fusion GPG keys
      ansible.builtin.dnf:
        name: distribution-gpg-keys
    - name: Add RPM Fusion Free GPG key
      ansible.builtin.rpm_key:
        key: /usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-free-fedora-{{ fedora_release_number }}
    - name: Add RPM Fusion Nonfree GPG key
      ansible.builtin.rpm_key:
        key: /usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-nonfree-fedora-{{ fedora_release_number }}
    - name: Add RPM Fusion repo packages
      ansible.builtin.dnf:
        name:
          # this does redownload them every time this playbook is run but it's like 10 kB idgaf
          - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ fedora_release_number }}.noarch.rpm
          - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ fedora_release_number }}.noarch.rpm

    - name: Import Sublime Text RPM keys
      ansible.builtin.rpm_key:
        key: https://download.sublimetext.com/sublimehq-rpm-pub.gpg

    - name: Import VS Code RPM keys
      ansible.builtin.rpm_key:
        key: https://packages.microsoft.com/keys/microsoft.asc

    - name: Add Sublime Text Stable repo
      ansible.builtin.command:
        cmd: dnf config-manager addrepo --from-repofile=https://download.sublimetext.com/rpm/stable/x86_64/sublime-text.repo
        creates: /etc/yum.repos.d/sublime-text.repo

    - name: Add Vivaldi Stable repo
      ansible.builtin.command:
        cmd: dnf config-manager addrepo --from-repofile=https://repo.vivaldi.com/stable/vivaldi-fedora.repo
        creates: /etc/yum.repos.d/vivaldi-fedora.repo

    - name: Add LibreWolf repo
      ansible.builtin.command:
        cmd: dnf config-manager addrepo --from-repofile=https://repo.librewolf.net/librewolf.repo
        creates: /etc/yum.repos.d/librewolf.repo

    - name: Add VS Code repo
      # extract the repo from microsoft installation instructions, then delete `autorefresh=1` (openSUSE option)
      ansible.builtin.command:
        cmd: dnf config-manager addrepo --from-repofile={{ playbook_dir }}/files/vscode.repo
        creates: /etc/yum.repos.d/vscode.repo

    - name: Enable Wezterm Copr repo
      community.general.copr:
        name: wezfurlong/wezterm-nightly
        state: enabled

    - name: Install NVIDIA drivers
      ansible.builtin.dnf:
        name:
          - akmod-nvidia-580xx
          - xorg-x11-drv-nvidia-580xx-cuda
          - libva-nvidia-driver

    - name: Replace ffmpeg-free with ffmpeg
      ansible.builtin.command:
        cmd: dnf swap ffmpeg-free ffmpeg --allowerasing -y
      register: ffmpeg_swap
      changed_when: "'Nothing to do' not in ffmpeg_swap.stdout"
    - name: Install multimedia group
      ansible.builtin.dnf:
        name: "@multimedia"
        exclude: PackageKit-gstreamer-plugin
        install_weak_deps: false
        state: present
    - name: Install sound-and-video group
      ansible.builtin.dnf:
        name: "@sound-and-video"
        state: present

    - name: Install packages
      ansible.builtin.dnf:
        name:
          # ansible deps/ansible
          - python3-pip
          - ansible

          # language stuff/deps
          - python3-tkinter
          - python3-bpython
          - python3-virtualenv
          - nodejs-bash-language-server
          - 'g++'
          - nix
          - dash
          - mono-devel
          - rust
          - cargo

          # cmdline stuff
          - distrobox
          - fuse
          - fuse-libs
          - fastfetch
          - git
          - gh
          - zsh
          - tmux
          - neovim
          - eza
          - fzf
          - fd-find
          - xsel
          - trash-cli
          - inotify-tools
          - libtree-sitter
          - tldr
          - yt-dlp
          - gpick

          # apps
          - vivaldi-stable # 3rd-Party Repo
          - wezterm # Copr
          - sublime-text # 3rd-Party Repo
          - librewolf # 3rd-Party Repo
          - code
          - syncthing
          - obs-studio
          - steam
          - okular
          - kolourpaint
          - seahorse
          - gparted
          - '@virtualization'
          - snapper
          - btrfs-assistant
          - winetricks

          # Game stuff
          - lutris

          # theming
          - cascadia-fonts-all
          - breeze-cursor-theme
          - papirus-icon-theme

    - name: Add Flathub Flatpak repo
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo

    - name: Install Flatpaks
      community.general.flatpak:
        name:
          - com.github.tchx84.Flatseal
          - md.obsidian.Obsidian
          - org.gimp.GIMP
          - org.shotcut.Shotcut
          - org.audacityteam.Audacity
          - io.github.Qalculate
          - com.saivert.pwvucontrol
          - ca.desrt.dconf-editor
          - org.flameshot.Flameshot
          - it.mijorus.gearlever
          - org.fedoraproject.MediaWriter
          - io.github.everestapi.Olympus
          - com.github.Anuken.Mindustry
          - org.prismlauncher.PrismLauncher

    - name: Install Cargo packages
      become: yes
      become_user: "{{ usern }}"
      community.general.cargo:
        name:
          - kanata

    - name: Enable and start nix daemon
      ansible.builtin.systemd_service:
        name: nix-daemon
        state: started
        enabled: true

    - name: Create uinput group
      # uinput/input groups are necessary to run Kanata (installed through nix)
      ansible.builtin.group:
        name: uinput
    - name: Add user "{{ usern }}" to groups
      ansible.builtin.user:
        name: "{{ usern }}"
        groups: docker,input,uinput
        append: true

    - name: Creating udev rules directory
      ansible.builtin.file:
        path: /etc/udev/rules.d
        state: directory
    - name: Copying Kanata udev rule config
      # Also necessary for Kanata
      ansible.builtin.copy:
        src: 9999-automated-uinput-udev.rules
        dest: /etc/udev/rules.d/9999-automated-uinput-udev.rules

    - name: Disabling zram
      ansible.builtin.copy:
        dest: /etc/systemd/zram-generator.conf
        content: ""
    - name: Enabling zswap
      ansible.builtin.command:
        argv: ["grubby", "--update-kernel=ALL", "--args", "zswap.enabled=1 zswap.max_pool_percent=40 zswap.compressor=lz4"]
      changed_when: false # im tired
      
    - name: Create btrfs swap subvolume
      community.general.btrfs_subvolume:
        name: /swap
        automount: true
    - name: Find btrfs device uuid
      ansible.builtin.command:
        cmd: findmnt -no UUID /
      register: root_uuid
      changed_when: false
    - name: Set btrfs device fact
      ansible.builtin.set_fact:
        btrfs_device: "{{ root_uuid.stdout }}"
    - name: Add swap subvolume to fstab
      ansible.posix.mount:
        path: /swap
        src: UUID={{ btrfs_device }}
        fstype: btrfs
        opts: subvol=swap,noatime
        state: mounted
    - name: Make btrfs swapfile
      ansible.builtin.command:
        cmd: btrfs filesystem mkswapfile --size 16g --uuid clear /swap/swapfile
        creates: /swap/swapfile
      register: swap_file_created
    - name: Restore SELinux context recursively on /swap
      ansible.builtin.command:
        cmd: restorecon -v /swap
      when: ansible_facts["selinux"].status == "enabled"
      register: restorecon_result
      changed_when: "'Relabeled' in restorecon_result.stdout"
    - name: Add persistent SELinux file context rule for swapfile
      community.general.sefcontext:
        target: /swap/swapfile
        setype: swapfile_t
        state: present
      when: ansible_facts["selinux"].status == "enabled"
    - name: Enable swap file
      when: swap_file_created is changed
      ansible.builtin.command:
        cmd: swapon /swap/swapfile
    - name: Add swap file to fstab
      ansible.builtin.mount:
        name: none
        src: /swap/swapfile
        fstype: swap
        opts: sw
        state: present

    # this fixes an audio issue
    - name: Creating wireplumber config directory
      ansible.builtin.file: 
        path: /etc/wireplumber/wireplumber.conf.d
        state: directory
    - name: Copying wireplumber config
      ansible.builtin.copy:
        src: 9999-automated-wireplumber.conf
        dest: /etc/wireplumber/wireplumber.conf.d/9999-automated-wireplumber.conf

    # this fixes a wifi issue
    - name: Creating NetworkManager config directory
      ansible.builtin.file: 
        path: /etc/NetworkManager/conf.d
        state: directory
    - name: Copying NetworkManager config
      ansible.builtin.copy:
        src: 9999-automated-wifi-powersave-off.conf
        dest: /etc/NetworkManager/conf.d/9999-automated-wifi-powersave-off.conf

    - name: Enabling Magic SysRq Key
      ansible.posix.sysctl:
        name: kernel.sysrq
        value: '246' # https://docs.kernel.org/admin-guide/sysrq.html

    # these optimizations are from arch/pop! wiki
    - name: Setting vm.swappiness
      ansible.posix.sysctl:
        name: vm.swappiness
        value: '180'
    - name: Setting vm.watermark_boost_factor
      ansible.posix.sysctl:
        name: vm.watermark_boost_factor
        value: '0'
    - name: Setting vm.watermark_scale_factor
      ansible.posix.sysctl:
        name: vm.watermark_scale_factor
        value: '125'
    - name: Setting vm.page-cluster
      ansible.posix.sysctl:
        name: vm.page-cluster
        value: '0'

    - name: Copying Slick Greeter config
      ansible.builtin.copy:
        src: slick-greeter.conf
        dest: /etc/lightdm/slick-greeter.conf

    # more questionably useful performance optimisations
    - name: Setting nice PAM limit
      community.general.pam_limits:
        domain: '*'
        limit_type: '-'
        limit_item: nice
        value: '-10'
    - name: Setting nofile PAM limit
      community.general.pam_limits:
        domain: '*'
        limit_type: '-'
        limit_item: nofile
        value: '524288'

    - name: Enable and start snapper timer
      ansible.builtin.systemd_service:
        name: snapper-timeline.timer
        state: started
        enabled: true
    - name: Enable and start snapper cleanup timer
      ansible.builtin.systemd_service:
        name: snapper-cleanup.timer
        state: started
        enabled: true
    - name: Create snapper root config
      ansible.builtin.command:
        cmd: snapper -c root create-config /
      register: snapper_create_root
      changed_when: "'subvolume already covered' not in snapper_create_root.stdout"
    - name: Create snapper home config
      ansible.builtin.command:
        cmd: snapper -c home create-config /home
      register: snapper_create_home
      changed_when: "'subvolume already covered' not in snapper_create_home.stdout"
