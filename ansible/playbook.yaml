- name: Default playbook
  tasks:
    - name: Import RPM GPG keys
      ansible.builtin.rpm_key:
        key:
          - 'https://download.sublimetext.com/sublimehq-rpm-pub.gpg'
        state: present

    #- name: Add Sublime Text 4 Stable repo
    #  ansible.builtin.command:
    #    cmd: dnf config-manager addrepo --from-repofile=https://download.sublimetext.com/rpm/stable/x86_64/sublime-text.repo
    #    creates: /etc/ # run the above command to figure out where .repos are stored

    - name: Enable Copr repos
      community.general.copr:
        name:
          - the4runner/firefox-dev
          - wezfurlong/wezterm-nightly
        state: enabled

    - name: Remove Copr repos
      community.general.copr:
        name:
          - 
        state: absent

    - name: Install packages
      ansible.builtin.dnf5:
        name:
          - python3-pip
          - distrobox
          - firefox-dev # Copr
          - wezterm # Copr
          - 'https://vencord.dev/download/vesktop/amd64/rpm'
        state: present

    - name: Remove packages
      ansible.builtin.dnf:
        name:
          - 
        state: absent

    - name: Install flatpaks
      community.general.flatpak:
        name:
          - com.github.tchx84.Flatseal
          - md.obsidian.Obsidian
          - fm.reaper.Reaper
        state: present

    - name: Remove flatpaks
      community.general.flatpak:
        name:
          - 
        state: absent

    - name: Install pip packages
      ansible.builtin.pip:
        name:
          - ansible
        state: present

    - name: Remove pip packages
      ansible.builtin.pip:
        name:
          - 
        state: absent
